version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: iitsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iitsm
      POSTGRES_USER: iitsm
      POSTGRES_PASSWORD: iitsm
    ports:
      - "5432:5432"
    volumes:
      - iitsm-postgres-data:/var/lib/postgresql/data

volumes:
  iitsm-postgres-data:
    driver: local
